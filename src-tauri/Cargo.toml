[package]
name = "snappy"
version = "0.1.0"
description = "Drag-and-drop blocks that translate directly to Python"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri builds the app as a library so mobile targets can share the entry point.
name = "snappy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
